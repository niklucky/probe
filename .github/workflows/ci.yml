name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.38
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bun test
      - run: bun run build

  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            file: apps/api/Dockerfile
            context: .
          - name: runner
            file: apps/runner/Dockerfile
            context: .
          - name: execution
            file: apps/runner/execution-image/Dockerfile
            context: apps/runner/execution-image
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: probe-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
