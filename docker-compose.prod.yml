version: "3.8"

services:
  # Database
  postgres:
    image: postgres:17-alpine
    container_name: signal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-signal_db}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:11001:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signal} -d ${POSTGRES_DB:-signal_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - signal-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Object Storage
  minio:
    image: minio/minio:latest
    container_name: signal-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-signal}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    ports:
      - "127.0.0.1:11002:9000"
      - "127.0.0.1:11003:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - signal-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MinIO bucket setup
  minio-setup:
    image: minio/mc:latest
    container_name: signal-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set signal http://minio:9000 ${MINIO_ACCESS_KEY:-signal} ${MINIO_SECRET_KEY:-signal_password};
      /usr/bin/mc mb signal/${MINIO_BUCKET:-signal-assets} || true;
      /usr/bin/mc anonymous set download signal/${MINIO_BUCKET:-signal-assets};
      exit 0;
      "
    networks:
      - signal-network
    restart: "no"

  # API Server
  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/signal-api:latest
    container_name: signal-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 11010
      DATABASE_URL: postgres://${POSTGRES_USER:-signal}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-signal_db}
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-signal}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-signal-assets}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-https://signal.hgdev.me/minio}
      FRONTEND_URL: ${FRONTEND_URL:-https://signal.hgdev.me}
    ports:
      - "127.0.0.1:11010:11010"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:11010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - signal-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Web Application
  web:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/signal-web:latest
    container_name: signal-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 11020
    ports:
      - "127.0.0.1:11020:11020"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:11020/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - signal-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  signal-network:
    driver: bridge
