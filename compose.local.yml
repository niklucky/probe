services:
  postgres:
    image: postgres:17-alpine
    container_name: probe-postgres
    environment:
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal_password
      POSTGRES_DB: signal_db
    ports:
      - "11001:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: probe-minio
    environment:
      MINIO_ROOT_USER: signal
      MINIO_ROOT_PASSWORD: signal_password
    ports:
      - "11002:9000"
      - "11003:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    container_name: probe-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set probe http://minio:9000 signal signal_password;
      /usr/bin/mc mb probe/signal-assets || true;
      /usr/bin/mc mb probe/signal-runner-artifacts || true;
      /usr/bin/mc anonymous set download probe/signal-assets || /usr/bin/mc policy set download probe/signal-assets;
      /usr/bin/mc anonymous set none probe/signal-runner-artifacts || true;
      exit 0;
      "

  # The execution worker is intentionally a separate opt-in process. Run
  # `bun run runner:dev` on the host after creating the restricted
  # `probe-runner-egress` Docker network described in docs/automation-runner.md.

  # Port reference for Probe project (11000-11100):
  # 11001 - Postgres
  # 11002 - MinIO API
  # 11003 - MinIO Console
  # 11010 - API Server (Hono)
  # 11020 - Web App (Vite/React)

volumes:
  postgres_data:
  minio_data:
